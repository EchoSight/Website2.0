<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page not found</title>

  <style>
    :root {
      --bg-dark: #0b0c10;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.75);
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100dvh;
    }

    .wrap {
      height: 100dvh;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
        url("./assets/videos/cave of bat.png") center /
          cover no-repeat;
      filter: brightness(0.6);
      transform: scale(1.02);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      z-index: 1;
    }

    .spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle closest-corner at 70% 40%,
        rgba(0, 0, 0, 0.2) 0%,
        rgba(0, 0, 0, 0.9) 65%
      );
      transition: background 0.12s linear;
      z-index: 2;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 84px);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .word {
      display: inline-flex;
      margin: 0 0.2em;
    }

    .char {
      display: inline-block;
      text-shadow: 0 0 0.25em rgba(255, 255, 255, 0.4);
    }

    .blur {
      animation: blurPulse 10s linear infinite;
    }

    .flicker {
      animation: blurPulse 10s linear infinite, flicker 1.3s infinite;
    }

    .broken {
      animation: blurPulse 10s linear infinite, breakTilt 2s ease-out forwards 3s;
      transform-origin: 0 30%;
    }

    @keyframes blurPulse {
      0%,
      40% {
        filter: blur(1px);
      }
      45% {
        filter: blur(0px);
      }
      50% {
        filter: blur(2px);
      }
      100% {
        filter: blur(1px);
      }
    }

    @keyframes flicker {
      0%,
      10%,
      100% {
        opacity: 1;
      }
      10.1%,
      11%,
      70.1% {
        opacity: 0;
      }
    }

    @keyframes breakTilt {
      to {
        transform: rotate(28deg);
        opacity: 0.6;
      }
    }

    p {
      margin: 8px 0 18px;
      max-width: 60ch;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .btn {
      background: var(--accent);
      color: #111;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }

    .btn:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 3px;
    }

    footer {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      opacity: 0.8;
      z-index: 3;
      letter-spacing: 0.04em;
    }

    @media (prefers-reduced-motion: reduce) {
      .char {
        animation: none !important;
      }

      .spotlight {
        background: rgba(0, 0, 0, 0.85);
        transition: none;
      }
    }

    @media (max-width: 640px) {
      p {
        font-size: 1rem;
      }

      footer {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap" id="wrap">
    <div class="bg" aria-hidden="true"></div>
    <div class="overlay" aria-hidden="true"></div>
    <div class="spotlight" id="spotlight" aria-hidden="true"></div>

    <section class="content">
      <h1 aria-label="Page not found">
        <span class="word">
          <span class="char blur">P</span>
          <span class="char blur">a</span>
          <span class="char blur">g</span>
          <span class="char blur">e</span>
        </span>
        <span class="word">
          <span class="char blur">n</span>
          <span class="char flicker">o</span>
          <span class="char blur">t</span>
        </span>
        <span class="word">
          <span class="char blur">f</span>
          <span class="char broken">o</span>
          <span class="char blur">u</span>
          <span class="char blur">n</span>
          <span class="char blur">d</span>
        </span>
      </h1>

      <p>Hmm, the page you were looking for doesn’t seem to exist anymore.</p>
      <a href="/" class="btn">Back to home</a>
    </section>

    <footer>
      <div>EchoSight</div>
      <div>404</div>
    </footer>
  </main>

  <script>
    const wrap = document.getElementById("wrap");
    const spotlight = document.getElementById("spotlight");
    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)");

    function updateSpotlight(x, y) {
      spotlight.style.background = `radial-gradient(circle closest-corner at ${x}px ${y}px, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.9) 65%)`;
    }

    if (!prefersReduced.matches) {
      wrap.addEventListener("pointermove", (event) => {
        updateSpotlight(event.clientX, event.clientY);
      });

      wrap.addEventListener("pointerleave", () => {
        spotlight.style.background = "rgba(0, 0, 0, 0.85)";
      });
    }
  </script>
</body>
</html>
